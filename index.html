<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0705">
  <meta name="description" content="Confira o cardápio digital do restaurante O Praeiro.">
  <title>Cardápio | O Praeiro Restaurante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Roboto:wght@400;500;700&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="cardapio.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topo">
    <img class="deco sol-img" src="img/sol.jpg" alt="" aria-hidden="true">
    <img class="deco palma-esq" src="img/palma-esq.jpg" alt="" aria-hidden="true">
    <div class="logo">
      <img class="emblema" src="img/logo.jpg" alt="" aria-hidden="true">
      <div>
        <h1 class="marca" id="nomeRestaurante">O Praeiro</h1>
        <p class="sub" id="subtitulo">RESTAURANTE</p>
      </div>
    </div>
    <p class="titulo-script"><span>Nosso Cardápio</span></p>
    <p class="boas-vindas" id="boasVindas"></p>
  </header>

  <nav class="abas" aria-label="Categorias do cardápio">
    <div class="abas-lista" id="abas" role="tablist" aria-label="Filtrar por categoria"></div>
  </nav>

  <main id="cardapio" aria-live="polite" aria-busy="false"></main>

  <section class="acoes" aria-label="Ações do cardápio">
    <a id="btnContato" class="botao" hidden target="_blank" rel="noopener noreferrer">Falar com o restaurante</a>
  </section>

  <footer class="rodape">
    <img class="deco palma-be" src="img/palma-be.jpg" alt="" aria-hidden="true">
    <img class="deco palma-bd" src="img/palma-bd.jpg" alt="" aria-hidden="true">
    <p id="frase"></p>
    <p id="endereco" class="pequeno" hidden></p>
    <p id="horario" class="pequeno" hidden></p>
    <p class="bemvindo"><span>Seja bem-vindo!</span></p>
  </footer>
</body>
</html>
